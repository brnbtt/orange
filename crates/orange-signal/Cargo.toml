[package]
name = "orange-signal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signalling protocol, Discord identity, and relay for orange. Deliberately free of any media dependency."

[dependencies]
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rand = "0.8"
# Azure Table Storage is reached over its REST API rather than through an SDK:
# the requests are two verbs and the signature is one HMAC, which is less code
# than the client library would add, and it reuses the reqwest already here.
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
httpdate = "1"

[dev-dependencies]
tower.workspace = true
