[package]
name = "orange-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop client for orange"

# The artifact keeps its old name on purpose. The updater that performs an
# upgrade is the one already installed, so it only learns "orange-client.exe"
# from the release that teaches it -- and orange.iss has no [InstallDelete], so
# renaming before then would leave both binaries present and reopen the older
# one, which would find the same update waiting and loop. Flip this to
# orange-client once installs predating that updater are gone, and change
# orange.iss with it.
[[bin]]
name = "orange-tray"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
anyhow.workspace = true
gpui = "0.2"
image = "0.25"
reqwest = { workspace = true, features = ["blocking"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]
