[package]
name = "orange"
version = "0.1.0"
edition = "2021"
description = "Low-overhead window streaming for friends"
license = "MIT"

[dependencies]
gstreamer = "0.25"
gstreamer-video = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-sdp = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
