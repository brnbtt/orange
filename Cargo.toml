[workspace]
resolver = "2"
members = ["crates/orange-signal", "crates/orange-relay", "crates/orange"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
