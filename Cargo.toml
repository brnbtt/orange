[workspace]
resolver = "2"
members = ["crates/orange-signal", "crates/orange-relay", "crates/orange", "crates/orange-tray", "crates/orange-updater"]

[workspace.package]
version = "0.2.0-beta.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
uuid = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
